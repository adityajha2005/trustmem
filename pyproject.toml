[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustmem"
version = "0.1.0"
description = "Trust-aware shared memory for multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "sqlalchemy>=2.0.0",
    "faiss-cpu>=1.9.0",
    "sentence-transformers>=3.3.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.90.0",
]
baselines = [
    "mem0ai>=0.1.110",
    "qdrant-client>=1.12.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
viz = [
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "baselines*",
    "memory*",
    "retrieval*",
    "storage*",
    "evaluation*",
    "benchmarks*",
    "experiments*",
    "orchestration*",
    "api*",
    "utils*",
    "demo*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "integration: real Mem0 / torch (set MEM0_INTEGRATION_TEST=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
