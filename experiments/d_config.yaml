# Benchmark D: real LLM agents, deterministic ground truth. Frozen with the design
# (docs/BENCHMARK_D.md). Changing anything below after a run starts gives a new run version;
# existing run artifacts are never overwritten.

# Credentials: only XAI_API_KEY / OPENAI_API_KEY are read from this existing file, in memory,
# for live generation. Nothing else in it is used; replay never reads it except to scan
# artifacts for the key values.
credentials_file: ~/Multi-agent/.env.local

# Retrieval settings pinned to Benchmark C (utils/config defaults at commit aaa83a4, unchanged
# since). Replay applies these over any .env/.env.local/MEMORY_* value.
retrieval_pinned:
  embedding_model: BAAI/bge-small-en-v1.5
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  retrieval_top_k: 5
  retrieval_candidate_k: 50
  semantic_weight: 0.45
  trust_weight: 0.25
  recency_weight: 0.15
  importance_weight: 0.15
  recency_half_life_hours: 168.0
  use_reranker: false
  default_min_trust: 0.0
  fusion_semantic_weight: 0.3
  fusion_trust_weight: 0.3
  reranker_weight: 0.3
  fusion_importance_weight: 0.1
  preserve_top_trusted_k: 1
  trust_bucket_reranking: false
  trust_bucket_threshold: 0.05
  trust_threshold: 0.0

# Trust parameters: identical to Benchmark C (experiments/c_params.yaml) so methods match.
role_prior:
  planner: 0.60
  coder: 0.70
  verifier: 0.95
prior_strength: 4
retention: 0.90
topic_threshold: 3

top_k: 5

# Task splits. Pilot and full use different seeds, so inspecting the pilot never reveals full tasks.
splits:
  pilot: {seed: "pilot-v1", tasks: 25}
  full: {seed: "full-v1", tasks: 100}

# Hard spend caps in USD per run directory (all models together), checked before every call
# against recorded usage plus the worst case of the next call.
budget_usd:
  pilot: 10.0
  full: 30.0

calls:
  max_parse_attempts: 2   # one retry when the reply is not valid JSON / misses fields
  max_api_retries: 2      # transient errors only (rate limit, timeout, 5xx); auth errors stop the run

# Models. Prices are USD per 1M tokens. Live generation refuses to start unless price_verified
# is true. Input/output prices verified by the user on the official pricing pages (2026-11-07).
# Cached-input discounts were not part of that check, so cached tokens are billed at the full
# input price here (cost can only be overestimated). Calls go to the global endpoints only;
# xAI's US regional endpoint (us.api.x.ai) would bill 1.1x, and price_multiplier must match
# the endpoint or generation refuses to start.
models:
  grok-4.7:
    provider: xai
    model_id: grok-4.7
    params: {temperature: 0, max_tokens: 2000}
    price_in: 2.00
    price_out: 6.00
    price_cached_in_unverified: true   # billed at price_in
    price_multiplier: 1.0
    price_verified: true
    price_checked_on: 2026-11-07
    price_verified_by: user, official pricing page
    price_source: https://docs.x.ai/docs/models
  gpt-6.1-sol:
    provider: openai
    model_id: gpt-6.1-sol
    params: {max_completion_tokens: 2000}  # temperature: provider default (1); 0 rejected (HTTP 400, 2026-11-07)
    price_in: 2.00
    price_out: 10.00
    price_cached_in_unverified: true   # billed at price_in
    price_multiplier: 1.0
    price_verified: true
    price_checked_on: 2026-11-07
    price_verified_by: user, official pricing page
    price_source: https://openai.com/api/pricing/
  gpt-6-luna:
    provider: openai
    model_id: gpt-6-luna
    params: {max_completion_tokens: 2000}  # temperature: provider default (1); 0 rejected (HTTP 400, 2026-11-07)
    price_in: 0.10
    price_out: 0.50
    price_cached_in_unverified: true   # billed at price_in
    price_multiplier: 1.0
    price_verified: true
    price_checked_on: 2026-11-07
    price_verified_by: user, official pricing page
    price_source: https://openai.com/api/pricing/

# The four methods, mapped onto the Benchmark C conditions of the same name.
methods:
  dense: {technique: simple_rag, ablation: null, reliability: null, evidence: false}
  static: {technique: collaborative, ablation: full_rerank, reliability: null, evidence: false}
  learned: {technique: collaborative, ablation: full_rerank, reliability: beta, evidence: false}
  learned_evidence: {technique: collaborative, ablation: full_rerank, reliability: beta, evidence: true}

# Pre-registered primary comparisons (paired by task, pooled over models; full split only).
primary_comparisons:
  - [learned, static]
  - [learned_evidence, learned]
  - [learned_evidence, dense]
bootstrap: {resamples: 2000, seed: 7}
