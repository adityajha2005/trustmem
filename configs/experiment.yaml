# Real-model experiment profile (loaded via MEMORY_EXPERIMENT_CONFIG=experiment)
# Env vars in .env.local still override these values.

app_name: multi-agent-memory-experiment
log_level: INFO

database_url: "sqlite:///./data/experiment.db"
faiss_index_path: "./data/experiment.faiss"

embedding_model: "BAAI/bge-small-en-v1.5"
reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

offline_retrieval: false
use_reranker: true

retrieval_top_k: 5
retrieval_candidate_k: 50
semantic_weight: 0.45
trust_weight: 0.25
recency_weight: 0.15
importance_weight: 0.15
recency_half_life_hours: 168.0

# Trust-aware reranker fusion (experiment defaults).
fusion_semantic_weight: 0.30
fusion_trust_weight: 0.30
reranker_weight: 0.30
fusion_importance_weight: 0.10
preserve_top_trusted_k: 1
trust_bucket_reranking: false
trust_bucket_threshold: 0.05
trust_threshold: 0.0

experiments_runs_dir: "./experiments/runs"
