app_name: multi-agent-memory
debug: false
log_level: INFO

api_host: "0.0.0.0"
api_port: 8000

database_url: "sqlite:///./data/memory.db"
faiss_index_path: "./data/faiss.index"
embedding_model: "BAAI/bge-small-en-v1.5"
reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# Overridden by MEMORY_OFFLINE_RETRIEVAL in .env.local (0 = real embeddings)
offline_retrieval: false

retrieval_top_k: 5
retrieval_candidate_k: 50
semantic_weight: 0.45
trust_weight: 0.25
recency_weight: 0.15
importance_weight: 0.15
recency_half_life_hours: 168.0
use_reranker: false
default_min_trust: 0.0

# Trust-aware reranker fusion (final stage). Override via MEMORY_* env vars.
fusion_semantic_weight: 0.30
fusion_trust_weight: 0.30
reranker_weight: 0.30
fusion_importance_weight: 0.10
preserve_top_trusted_k: 1
trust_bucket_reranking: false
trust_bucket_threshold: 0.05
trust_threshold: 0.0

experiments_runs_dir: "./experiments/runs"
